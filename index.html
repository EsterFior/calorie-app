<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="热量图鉴">
<meta name="theme-color" content="#F2F2F7">
<meta name="format-detection" content="telephone=no">
<title>热量图鉴</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#1C1C1E; --text2:#8E8E93;
  --line:#E5E5EA; --accent:#34C759; --accent-d:#28A745; --danger:#FF3B30;
  --radius:14px;
}
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; padding:0; height:100%; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.4;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
[hidden]{ display:none !important; }
button{ font-family:inherit; touch-action:manipulation; cursor:pointer; }
input,select{ font-family:inherit; }

.app{ display:flex; flex-direction:column; height:100vh; height:100dvh; }

/* 顶栏 */
.topbar{
  flex:none; padding-top:env(safe-area-inset-top);
  background:rgba(242,242,247,.94);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--line); position:relative; z-index:10;
}
.topbar-inner{ height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 16px; }
.topbar h1{ font-size:20px; font-weight:700; margin:0; letter-spacing:-.3px; }
.icon-btn{
  width:34px; height:34px; border-radius:50%; border:none;
  background:var(--accent); color:#fff; font-size:24px; line-height:1;
  display:flex; align-items:center; justify-content:center; padding:0 0 3px;
}
.icon-btn:active{ background:var(--accent-d); }

/* 主体 */
#view{ flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.page{ padding:12px 16px 32px; }

/* 底部导航 */
.tabbar{
  flex:none; display:flex; background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  border-top:.5px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  flex:1; border:none; background:none; padding:7px 0 5px;
  display:flex; flex-direction:column; align-items:center; gap:1px;
  font-size:11px; color:var(--text2); font-weight:500;
}
.tab span{ font-size:21px; line-height:1.15; }
.tab.active{ color:var(--accent); }

/* 卡片 */
.card{ background:var(--card); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.05); }

/* 分类 */
.cat-head{
  width:100%; border:none; background:none; padding:14px 16px;
  display:flex; align-items:center; gap:10px; text-align:left;
  font-size:17px; font-weight:600; color:var(--text);
}
.cat-head:active{ background:#F7F7FA; }
.cat-title{ flex:1; }
.cat-meta{ font-size:13px; color:var(--text2); font-weight:400; }
.chev{ font-size:22px; color:#C7C7CC; transition:transform .2s; transform:rotate(90deg); line-height:1; }
.chev.open{ transform:rotate(-90deg); }
.cat-body{ border-top:.5px solid var(--line); }

/* 食物行 */
.food-row{
  display:flex; align-items:center; gap:10px;
  padding:12px 16px; border-bottom:.5px solid var(--line);
  background:#fff;
}
.food-row:active{ background:#F7F7FA; }
.food-info{ flex:1; min-width:0; }
.food-name{ font-size:16px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.food-sub{ font-size:12.5px; color:var(--text2); margin-top:2px; }
.food-kcal{ font-size:16px; font-weight:600; color:var(--accent); white-space:nowrap; }
.food-kcal .unit{ font-size:11px; font-weight:500; margin-left:2px; color:var(--text2); }

.cat-actions{ display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px; }

/* 按钮 */
.btn{
  border:1px solid var(--line); background:#fff; color:var(--text);
  border-radius:10px; padding:9px 14px; font-size:14px; font-weight:500;
}
.btn:active{ opacity:.65; }
.btn:disabled{ opacity:.35; }
.btn-primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
.btn-danger{ background:#fff; color:var(--danger); border-color:#FFD1CE; }
.btn-danger.armed{ background:var(--danger); color:#fff; border-color:var(--danger); }
.btn-block{ width:100%; display:block; padding:12px; font-size:16px; }

/* 搜索 */
.search-wrap{ position:relative; margin-bottom:12px; }
.search-wrap input{
  width:100%; border:none; border-radius:10px; background:#E3E3E8;
  padding:10px 36px; font-size:16px; color:var(--text); outline:none;
  -webkit-appearance:none; appearance:none;
}
.search-wrap input::-webkit-search-cancel-button{ display:none; }
.search-icon{ position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:14px; opacity:.45; pointer-events:none; }
.clear-btn{
  position:absolute; right:7px; top:50%; transform:translateY(-50%);
  width:24px; height:24px; border-radius:50%; border:none; background:#C7C7CC;
  color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center; padding:0;
}
.inner-search{ margin-bottom:10px; }

/* 分段控件 */
.seg{ display:flex; background:#E9E9ED; border-radius:10px; padding:3px; gap:3px; }
.seg button{
  flex:1; border:none; background:none; padding:9px 6px; border-radius:8px;
  font-size:15px; color:var(--text); font-weight:500;
}
.seg button.on{ background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.13); font-weight:600; }

/* 表单 */
.field{ margin-bottom:14px; }
.field label{ display:block; font-size:13px; color:var(--text2); margin-bottom:6px; font-weight:500; }
.input{
  width:100%; border:1px solid var(--line); border-radius:10px;
  padding:11px 12px; font-size:16px; background:#fff; color:var(--text);
  outline:none; -webkit-appearance:none; appearance:none;
}
.input:focus{ border-color:var(--accent); }
.input-lg{ font-size:18px; padding:14px; }
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
input[type=date]{ text-align:center; }

/* 双输入（千卡/千焦） */
.dual{ display:flex; gap:10px; }
.dual-item{ flex:1; min-width:0; }
.dual-label{ display:block; font-size:11.5px; color:var(--text2); margin-bottom:4px; }
.dual-item .input{ font-size:16px; }
.hint{ font-size:12px; color:var(--text2); margin-top:8px; line-height:1.5; }

/* 空状态 */
.empty{ text-align:center; color:var(--text2); padding:60px 20px; font-size:15px; line-height:1.9; }
.empty-sub{ font-size:13px; opacity:.85; }
.empty-small{ padding:16px; text-align:center; color:var(--text2); font-size:14px; }
.section-label{ font-size:13px; color:var(--text2); margin:2px 4px 8px; font-weight:500; }

/* 底部面板 */
.backdrop{
  position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:100;
  opacity:0; pointer-events:none; transition:opacity .25s;
}
.backdrop.open{ opacity:1; pointer-events:auto; }
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:101;
  background:#F7F7FA; border-radius:16px 16px 0 0;
  transform:translateY(100%); transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:90vh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.open{ transform:translateY(0); }
.sheet-head{ flex:none; display:flex; align-items:center; justify-content:space-between; padding:16px 16px 10px; }
.sheet-title{ font-size:17px; font-weight:700; }
.sheet-close{
  width:30px; height:30px; border-radius:50%; border:none; background:#E3E3E8;
  color:#8E8E93; font-size:14px; display:flex; align-items:center; justify-content:center; padding:0;
}
.sheet-body{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:6px 16px 28px; }
.sheet-actions{ display:flex; flex-direction:column; gap:10px; margin-top:18px; }

/* 食物选择 */
.pick-list{ display:flex; flex-direction:column; gap:8px; }
.pick-row{
  width:100%; text-align:left; border:1px solid var(--line); background:#fff;
  border-radius:12px; padding:12px 14px; color:inherit;
}
.pick-row:active{ background:#F0FBF2; border-color:var(--accent); }
.pick-name{ font-size:16px; font-weight:500; }
.pick-sub{ font-size:12.5px; color:var(--text2); margin-top:2px; }

.picked-card{ background:#F0FBF2; border:1px solid #C8EED2; border-radius:12px; padding:12px 14px; margin-bottom:14px; }
.picked-name{ font-size:17px; font-weight:600; }
.picked-sub{ font-size:13px; color:var(--text2); margin-top:2px; }
.calc-box{
  display:flex; justify-content:space-between; align-items:center;
  background:#fff; border-radius:12px; padding:14px; margin-bottom:12px; font-size:15px;
  border:1px solid var(--line);
}
.calc-box strong{ font-size:20px; color:var(--accent); }
.quick-amounts{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.chip{
  border:1px solid var(--line); background:#fff; border-radius:999px;
  padding:7px 16px; font-size:14px; color:var(--text);
}
.chip:active{ background:#F0FBF2; }

/* 一日规划 */
.date-bar{ display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.date-bar input[type=date]{
  flex:1; border:none; background:#fff; border-radius:10px; padding:10px;
  font-size:16px; color:var(--text); -webkit-appearance:none; appearance:none;
}
.day-btn{ width:42px; height:42px; flex:none; border:none; background:#fff; border-radius:10px; font-size:20px; color:var(--text); }
.day-btn:active{ background:#E9E9ED; }

/* 餐次折叠头 */
.meal-head{
  width:100%; border:none; background:#fff; padding:14px 16px;
  display:flex; align-items:center; gap:10px; text-align:left;
}
.meal-head:active{ background:#F7F7FA; }
.meal-name{ flex:1; font-size:17px; font-weight:600; color:var(--text); }
.meal-kcal{ font-size:15px; font-weight:600; color:var(--accent); flex:none; }
.meal-chev{
  font-size:20px; color:#C7C7CC; flex:none; line-height:1;
  transition:transform .2s; transform:rotate(0deg);
}
.meal-chev.open{ transform:rotate(90deg); }

.meal-items{ border-top:.5px solid var(--line); }

.entry-row{
  display:flex; align-items:center; gap:8px;
  padding:10px 16px; border-bottom:.5px solid var(--line);
}
.entry-info{ flex:1; min-width:0; }
.entry-name{ font-size:15.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.entry-amount{ display:flex; align-items:center; gap:3px; flex:none; }
.entry-amount input{
  width:64px; border:1px solid var(--line); border-radius:8px;
  padding:7px 4px; font-size:15px; text-align:center; background:#fff; color:var(--text);
  outline:none; -webkit-appearance:none; appearance:none;
}
.entry-amount input:focus{ border-color:var(--accent); background:#F0FBF2; }
.amount-unit{ font-size:12px; color:var(--text2); width:20px; }
.entry-kcal{ font-size:15px; font-weight:600; color:var(--accent); white-space:nowrap; min-width:48px; text-align:right; }
.entry-del{
  width:26px; height:26px; flex:none; border-radius:50%; border:none;
  background:#F2F2F7; color:#8E8E93; font-size:12px; padding:0;
  display:flex; align-items:center; justify-content:center;
}
.entry-del:active{ background:#FFE5E3; color:var(--danger); }
.meal-foot{ padding:12px 16px; }

.total-card{
  padding:16px; display:flex; align-items:center; justify-content:space-between;
  background:linear-gradient(135deg,#3ED271,#23A94A); color:#fff; border-radius:var(--radius);
  margin-bottom:12px; box-shadow:0 2px 10px rgba(52,199,89,.3);
}
.total-label{ font-size:14px; opacity:.92; font-weight:500; }
.total-value{ font-size:26px; font-weight:700; letter-spacing:-.5px; }
.total-value span{ font-size:14px; font-weight:500; opacity:.9; }

/* Toast */
.toast{
  position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px);
  background:rgba(0,0,0,.82); color:#fff; padding:10px 18px; border-radius:20px;
  font-size:14px; opacity:0; pointer-events:none; z-index:200; white-space:nowrap;
  transition:opacity .25s, transform .25s;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <h1 id="pageTitle">食物图鉴</h1>
      <button class="icon-btn" id="topAction" aria-label="新建分类">＋</button>
    </div>
  </header>

  <main id="view">
    <!-- 图鉴 -->
    <section id="bookView" class="page">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="search" placeholder="搜索食物名称" autocomplete="off" autocorrect="off" spellcheck="false">
        <button id="clearSearch" class="clear-btn" hidden>✕</button>
      </div>
      <div id="bookList"></div>
    </section>

    <!-- 一日规划 -->
    <section id="planView" class="page" hidden>
      <div class="date-bar">
        <button class="day-btn" id="prevDay">‹</button>
        <input type="date" id="planDate">
        <button class="day-btn" id="nextDay">›</button>
      </div>
      <div id="planList"></div>
    </section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="book"><span>📖</span>图鉴</button>
    <button class="tab" data-tab="plan"><span>🍱</span>一日规划</button>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <div class="sheet-title" id="sheetTitle"></div>
    <button class="sheet-close" id="sheetClose">✕</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   工具
   ========================================================= */
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
function fmt(n){
  const r = Math.round(num(n) * 10) / 10;
  return Number.isInteger(r) ? String(r) : r.toFixed(1);
}
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* 千卡 ⇄ 千焦：千卡 = 千焦 / 4 */
const KJ_PER_KCAL = 4;
const kcalToKj = k => num(k) * KJ_PER_KCAL;
const kjToKcal = j => num(j) / KJ_PER_KCAL;

/* =========================================================
   数据
   ========================================================= */
const LS_KEY = 'calorieBook_v2';
const LS_KEY_OLD = 'calorieBook_v1';

const MEALS = [
  { key:'breakfast',     label:'早餐',   icon:'🌅' },
  { key:'morningSnack',  label:'早加餐', icon:'🍎' },
  { key:'lunch',         label:'午餐',   icon:'☀️' },
  { key:'afternoonSnack',label:'午加餐', icon:'🍪' },
  { key:'dinner',        label:'晚餐',   icon:'🌙' },
  { key:'eveningSnack',  label:'晚加餐', icon:'🥛' }
];

function emptyPlan(){
  const o = {};
  MEALS.forEach(m => o[m.key] = []);
  return o;
}

function defaultData(){
  const cat = (name, foods) => ({ id: uid(), name, foods });
  const f100 = (name, unit, kcal) => ({
    id: uid(), name, unit, basis:'100',
    kcal100: kcal, kj100: kcalToKj(kcal),
    servingSize:'', servingKcal:'', servingKJ:''
  });
  const fSrv = (name, unit, size, kcal) => ({
    id: uid(), name, unit, basis:'serving',
    kcal100:'', kj100:'',
    servingSize: size, servingKcal: kcal, servingKJ: kcalToKj(kcal)
  });

  return {
    categories: [
      cat('主食', [
        f100('白米饭','g',116),
        f100('馒头','g',223),
        f100('煮面条','g',110),
        fSrv('全麦面包','g',35,90)
      ]),
      cat('肉蛋豆', [
        f100('鸡胸肉','g',133),
        f100('瘦牛肉','g',125),
        fSrv('鸡蛋','g',50,72),
        f100('北豆腐','g',82)
      ]),
      cat('蔬菜', [
        f100('西兰花','g',36),
        f100('黄瓜','g',16),
        f100('番茄','g',20)
      ]),
      cat('水果', [
        f100('苹果','g',53),
        f100('香蕉','g',93),
        f100('蓝莓','g',57)
      ]),
      cat('饮品', [
        f100('牛奶','ml',54),
        f100('无糖豆浆','ml',31),
        f100('可乐','ml',43)
      ])
    ],
    plans: {}
  };
}

/* 补全旧数据中的千焦字段与缺失餐次 */
function migrate(d){
  if(!d || !Array.isArray(d.categories)) return defaultData();
  d.plans = d.plans || {};
  d.categories.forEach(c => {
    if(!Array.isArray(c.foods)) c.foods = [];
    c.foods.forEach(f => {
      if(f.basis === 'serving'){
        if(f.servingKJ == null || f.servingKJ === '') f.servingKJ = kcalToKj(f.servingKcal);
      }else{
        if(f.kj100 == null || f.kj100 === '') f.kj100 = kcalToKj(f.kcal100);
      }
      if(f.unit !== 'g' && f.unit !== 'ml') f.unit = 'g';
      if(f.basis !== 'serving') f.basis = '100';
    });
  });
  Object.keys(d.plans).forEach(k => {
    const p = d.plans[k] || {};
    MEALS.forEach(m => { if(!Array.isArray(p[m.key])) p[m.key] = []; });
  });
  return d;
}

let state;
function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY) || localStorage.getItem(LS_KEY_OLD);
    if(raw) return migrate(JSON.parse(raw));
  }catch(e){}
  return defaultData();
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){}
}

state = loadState();

/* 查找 */
function findFoodById(id){
  for(const c of state.categories){
    const f = c.foods.find(x => x.id === id);
    if(f) return f;
  }
  return null;
}
function findCategoryOfFood(id){
  return state.categories.find(c => c.foods.some(f => f.id === id)) || null;
}

/* 热量换算 */
function foodKcal(food, amount){
  if(!food) return 0;
  const a = num(amount);
  if(a <= 0) return 0;
  if(food.basis === 'serving'){
    const sz = num(food.servingSize);
    if(sz <= 0) return 0;
    return a / sz * num(food.servingKcal);
  }
  return a / 100 * num(food.kcal100);
}
function foodKJValue(food){
  if(!food) return 0;
  if(food.basis === 'serving'){
    const v = food.servingKJ;
    if(v != null && v !== '') return num(v);
    return kcalToKj(food.servingKcal);
  }
  const v = food.kj100;
  if(v != null && v !== '') return num(v);
  return kcalToKj(food.kcal100);
}
function basisText(food){
  if(food.basis === 'serving'){
    return `每份 ${fmt(food.servingSize)}${food.unit} · ${fmt(food.servingKcal)} kcal / ${fmt(foodKJValue(food))} kJ`;
  }
  return `每100${food.unit} · ${fmt(food.kcal100)} kcal / ${fmt(foodKJValue(food))} kJ`;
}
function unitName(u){ return u === 'ml' ? '毫升' : '克'; }

/* =========================================================
   面板
   ========================================================= */
const sheetEl = document.getElementById('sheet');
const sheetBody = document.getElementById('sheetBody');
const sheetTitle = document.getElementById('sheetTitle');
const backdrop = document.getElementById('backdrop');

function openSheet(title, html){
  sheetTitle.textContent = title;
  sheetBody.innerHTML = html;
  sheetBody.scrollTop = 0;
  sheetEl.classList.add('open');
  backdrop.classList.add('open');
}
function closeSheet(){
  sheetEl.classList.remove('open');
  backdrop.classList.remove('open');
}
document.getElementById('sheetClose').onclick = closeSheet;
backdrop.onclick = closeSheet;

function promptText(title, value, placeholder, onOk){
  openSheet(title, `
    <div class="field">
      <input id="promptInput" class="input input-lg" type="text" value="${esc(value)}" placeholder="${esc(placeholder)}">
    </div>
    <div class="sheet-actions">
      <button class="btn btn-primary btn-block" id="promptOk">确定</button>
    </div>
  `);
  const inp = document.getElementById('promptInput');
  setTimeout(() => { try{ inp.focus(); inp.select(); }catch(e){} }, 120);
  document.getElementById('promptOk').onclick = () => {
    const v = inp.value.trim();
    if(!v){ toast('名称不能为空'); return; }
    closeSheet();
    onOk(v);
  };
}

/* =========================================================
   图鉴
   ========================================================= */
let searchQuery = '';
const expanded = new Set();

const bookListEl = document.getElementById('bookList');
const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearch');

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  clearSearchBtn.hidden = !searchQuery;
  renderBookList();
});
clearSearchBtn.onclick = () => {
  searchInput.value = '';
  searchQuery = '';
  clearSearchBtn.hidden = true;
  renderBookList();
};

function foodRowHTML(cat, food, showCat){
  const mainKcal = food.basis === 'serving' ? num(food.servingKcal) : num(food.kcal100);
  const sub = (showCat ? esc(cat.name) + ' · ' : '') + basisText(food);
  return `<div class="food-row" data-cat="${cat.id}" data-food="${food.id}">
    <div class="food-info">
      <div class="food-name">${esc(food.name)}</div>
      <div class="food-sub">${sub}</div>
    </div>
    <div class="food-kcal">${fmt(mainKcal)}<span class="unit">kcal</span></div>
  </div>`;
}

function catCardHTML(cat, idx){
  const open = expanded.has(cat.id);
  const foodsHTML = cat.foods.length
    ? cat.foods.map(f => foodRowHTML(cat, f, false)).join('')
    : '<div class="empty-small">这个分类还没有食物</div>';

  return `<div class="card">
    <button class="cat-head" data-cat="${cat.id}">
      <span class="cat-title">${esc(cat.name)}</span>
      <span class="cat-meta">${cat.foods.length} 种</span>
      <span class="chev ${open ? 'open' : ''}">›</span>
    </button>
    ${open ? `<div class="cat-body">
      ${foodsHTML}
      <div class="cat-actions">
        <button class="btn btn-primary" data-act="addFood" data-cat="${cat.id}">＋ 添加食物</button>
        <button class="btn" data-act="rename" data-cat="${cat.id}">重命名</button>
        <button class="btn" data-act="up" data-cat="${cat.id}" ${idx === 0 ? 'disabled' : ''}>上移</button>
        <button class="btn" data-act="down" data-cat="${cat.id}" ${idx === state.categories.length - 1 ? 'disabled' : ''}>下移</button>
        <button class="btn btn-danger" data-act="del" data-cat="${cat.id}">删除分类</button>
      </div>
    </div>` : ''}
  </div>`;
}

function renderBookList(){
  const q = searchQuery.trim().toLowerCase();

  if(q){
    const rows = [];
    state.categories.forEach(cat => {
      cat.foods.forEach(food => {
        if(food.name.toLowerCase().includes(q)) rows.push({ cat, food });
      });
    });
    if(!rows.length){
      bookListEl.innerHTML = `<div class="empty">没有找到「${esc(searchQuery)}」<br><span class="empty-sub">可以在图鉴里添加这个食物</span></div>`;
      return;
    }
    bookListEl.innerHTML =
      `<div class="section-label">搜索结果 ${rows.length} 条 · 点按查看详情</div>` +
      rows.map(r => foodRowHTML(r.cat, r.food, true)).join('');
    return;
  }

  if(!state.categories.length){
    bookListEl.innerHTML = `<div class="empty">还没有分类<br><span class="empty-sub">点右上角 ＋ 添加第一个分类</span></div>`;
    return;
  }

  bookListEl.innerHTML = state.categories.map((cat, i) => catCardHTML(cat, i)).join('');
}

bookListEl.addEventListener('click', e => {
  const act = e.target.closest('[data-act]');
  if(act){ handleCatAction(act); return; }

  const head = e.target.closest('.cat-head');
  if(head){
    const id = head.dataset.cat;
    if(expanded.has(id)) expanded.delete(id); else expanded.add(id);
    renderBookList();
    return;
  }

  const row = e.target.closest('.food-row');
  if(row){ openFoodEditor(row.dataset.cat, row.dataset.food); return; }
});

function handleCatAction(btn){
  const catId = btn.dataset.cat;
  const cat = state.categories.find(c => c.id === catId);
  if(!cat) return;

  switch(btn.dataset.act){
    case 'addFood':
      openFoodEditor(catId, null);
      break;
    case 'rename':
      promptText('重命名分类', cat.name, '分类名称', v => {
        cat.name = v; save(); renderBookList(); toast('已重命名');
      });
      break;
    case 'up':   moveCat(catId, -1); break;
    case 'down': moveCat(catId, 1);  break;
    case 'del': {
      if(!btn.classList.contains('armed')){
        btn.classList.add('armed');
        btn.textContent = '再点一次确认删除';
        setTimeout(() => {
          if(btn.isConnected){ btn.classList.remove('armed'); btn.textContent = '删除分类'; }
        }, 3000);
        return;
      }
      state.categories = state.categories.filter(c => c.id !== catId);
      expanded.delete(catId);
      save(); renderBookList(); toast('已删除分类');
      break;
    }
  }
}

function moveCat(catId, dir){
  const i = state.categories.findIndex(c => c.id === catId);
  const j = i + dir;
  if(i < 0 || j < 0 || j >= state.categories.length) return;
  const tmp = state.categories[i];
  state.categories[i] = state.categories[j];
  state.categories[j] = tmp;
  save(); renderBookList();
}

document.getElementById('topAction').onclick = () => {
  promptText('新建分类', '', '例如：主食 / 零食 / 饮品', name => {
    const c = { id: uid(), name, foods: [] };
    state.categories.push(c);
    expanded.add(c.id);
    save(); renderBookList();
  });
};

/* =========================================================
   食物编辑面板
   ========================================================= */
function openFoodEditor(catId, foodId){
  const cat = state.categories.find(c => c.id === catId);
  if(!cat) return;

  const existing = foodId ? cat.foods.find(f => f.id === foodId) : null;
  const isNew = !existing;

  const draft = existing
    ? {
        id: existing.id, name: existing.name, unit: existing.unit, basis: existing.basis,
        kcal100: existing.kcal100 === '' || existing.kcal100 == null ? '' : existing.kcal100,
        kj100: existing.kj100 === '' || existing.kj100 == null ? '' : existing.kj100,
        servingSize: existing.servingSize, servingKcal: existing.servingKcal,
        servingKJ: existing.servingKJ === '' || existing.servingKJ == null ? '' : existing.servingKJ
      }
    : {
        id: uid(), name:'', unit:'g', basis:'100',
        kcal100:'', kj100:'', servingSize:'', servingKcal:'', servingKJ:''
      };

  let targetCatId = catId;

  const catOptions = state.categories
    .map(c => `<option value="${c.id}" ${c.id === catId ? 'selected' : ''}>${esc(c.name)}</option>`)
    .join('');

  openSheet(isNew ? '添加食物' : '食物详情', `
    <div class="field">
      <label>食物名称</label>
      <input id="fName" class="input" type="text" value="${esc(draft.name)}" placeholder="例如：白米饭">
    </div>
    <div class="field">
      <label>所属分类</label>
      <select id="fCat" class="input">${catOptions}</select>
    </div>
    <div class="field">
      <label>计量单位</label>
      <div class="seg" id="fUnit">
        <button type="button" data-v="g">克（g）</button>
        <button type="button" data-v="ml">毫升（ml）</button>
      </div>
    </div>
    <div class="field">
      <label>热量标注方式</label>
      <div class="seg" id="fBasis">
        <button type="button" data-v="100">每 100<span id="unitLbl">${draft.unit}</span></button>
        <button type="button" data-v="serving">按份计算</button>
      </div>
    </div>
    <div id="fExtra"></div>
    <div class="sheet-actions">
      <button class="btn btn-primary btn-block" id="fSave">保存</button>
      ${isNew ? '' : '<button class="btn btn-danger btn-block" id="fDel">删除这个食物</button>'}
    </div>
  `);

  const $ = id => document.getElementById(id);

  function harvest(){
    if($('fName')) draft.name = $('fName').value;
    if($('fCat')) targetCatId = $('fCat').value;
    if($('fKcal100')) draft.kcal100 = $('fKcal100').value;
    if($('fKj100')) draft.kj100 = $('fKj100').value;
    if($('fServingSize')) draft.servingSize = $('fServingSize').value;
    if($('fServingKcal')) draft.servingKcal = $('fServingKcal').value;
    if($('fServingKJ')) draft.servingKJ = $('fServingKJ').value;
  }

  function syncSegs(){
    document.querySelectorAll('#fUnit button').forEach(b => b.classList.toggle('on', b.dataset.v === draft.unit));
    document.querySelectorAll('#fBasis button').forEach(b => b.classList.toggle('on', b.dataset.v === draft.basis));
    const lbl = $('unitLbl');
    if(lbl) lbl.textContent = draft.unit;
  }

  /* 千卡 / 千焦 双向自动换算 */
  function bindDual(kcalEl, kjEl){
    kcalEl.addEventListener('input', () => {
      const v = kcalEl.value.trim();
      if(v === ''){ kjEl.value = ''; return; }
      const k = parseFloat(v);
      kjEl.value = isNaN(k) ? '' : fmt(kcalToKj(k));
    });
    kjEl.addEventListener('input', () => {
      const v = kjEl.value.trim();
      if(v === ''){ kcalEl.value = ''; return; }
      const j = parseFloat(v);
      kcalEl.value = isNaN(j) ? '' : fmt(kjToKcal(j));
    });
  }

  function renderExtra(){
    const el = $('fExtra');
    if(!el) return;

    if(draft.basis === '100'){
      el.innerHTML = `
        <div class="field">
          <label>每 100${draft.unit} 的热量</label>
          <div class="dual">
            <div class="dual-item">
              <span class="dual-label">千卡（kcal）</span>
              <input id="fKcal100" class="input" type="number" inputmode="decimal"
                     value="${draft.kcal100 === '' ? '' : esc(draft.kcal100)}" placeholder="例如 116">
            </div>
            <div class="dual-item">
              <span class="dual-label">千焦（kJ）</span>
              <input id="fKj100" class="input" type="number" inputmode="decimal"
                     value="${draft.kj100 === '' ? '' : esc(draft.kj100)}" placeholder="例如 464">
            </div>
          </div>
          <div class="hint">千卡 = 千焦 ÷ 4，输入任意一项会自动换算另一项</div>
        </div>`;
      bindDual($('fKcal100'), $('fKj100'));
    }else{
      el.innerHTML = `
        <div class="field">
          <label>每份的重量（${unitName(draft.unit)}）</label>
          <input id="fServingSize" class="input" type="number" inputmode="decimal"
                 value="${draft.servingSize === '' ? '' : esc(draft.servingSize)}" placeholder="例如 50">
        </div>
        <div class="field">
          <label>每份的热量</label>
          <div class="dual">
            <div class="dual-item">
              <span class="dual-label">千卡（kcal）</span>
              <input id="fServingKcal" class="input" type="number" inputmode="decimal"
                     value="${draft.servingKcal === '' ? '' : esc(draft.servingKcal)}" placeholder="例如 72">
            </div>
            <div class="dual-item">
              <span class="dual-label">千焦（kJ）</span>
              <input id="fServingKJ" class="input" type="number" inputmode="decimal"
                     value="${draft.servingKJ === '' ? '' : esc(draft.servingKJ)}" placeholder="例如 288">
            </div>
          </div>
          <div class="hint">千卡 = 千焦 ÷ 4，输入任意一项会自动换算另一项</div>
        </div>`;
      bindDual($('fServingKcal'), $('fServingKJ'));
    }
  }

  $('fUnit').addEventListener('click', e => {
    const b = e.target.closest('button');
    if(!b) return;
    harvest();
    draft.unit = b.dataset.v;
    syncSegs(); renderExtra();
  });

  $('fBasis').addEventListener('click', e => {
    const b = e.target.closest('button');
    if(!b) return;
    harvest();
    draft.basis = b.dataset.v;
    syncSegs(); renderExtra();
  });

  syncSegs();
  renderExtra();

  $('fSave').onclick = () => {
    harvest();
    const name = draft.name.trim();
    if(!name){ toast('请填写食物名称'); return; }

    let kcalVal, kjVal;
    if(draft.basis === '100'){
      kcalVal = num(draft.kcal100);
      kjVal = num(draft.kj100);
      if(kcalVal <= 0 && kjVal > 0) kcalVal = kjToKcal(kjVal);
      if(kjVal <= 0 && kcalVal > 0) kjVal = kcalToKj(kcalVal);
      if(!(kcalVal > 0)){ toast(`请填写每100${draft.unit}的热量`); return; }
    }else{
      if(!(num(draft.servingSize) > 0)){ toast('请填写每份的重量'); return; }
      kcalVal = num(draft.servingKcal);
      kjVal = num(draft.servingKJ);
      if(kcalVal <= 0 && kjVal > 0) kcalVal = kjToKcal(kjVal);
      if(kjVal <= 0 && kcalVal > 0) kjVal = kcalToKj(kcalVal);
      if(!(kcalVal > 0)){ toast('请填写每份的热量'); return; }
    }

    const newFood = {
      id: draft.id,
      name,
      unit: draft.unit,
      basis: draft.basis,
      kcal100: draft.basis === '100' ? Math.round(kcalVal * 10) / 10 : '',
      kj100:   draft.basis === '100' ? Math.round(kjVal * 10) / 10 : '',
      servingSize: draft.basis === 'serving' ? num(draft.servingSize) : '',
      servingKcal: draft.basis === 'serving' ? Math.round(kcalVal * 10) / 10 : '',
      servingKJ:   draft.basis === 'serving' ? Math.round(kjVal * 10) / 10 : ''
    };

    const oldCat = findCategoryOfFood(draft.id);
    let oldPos = -1;
    if(oldCat){
      oldPos = oldCat.foods.findIndex(f => f.id === draft.id);
      oldCat.foods.splice(oldPos, 1);
    }

    const destCat = state.categories.find(c => c.id === targetCatId) || state.categories[0];
    if(!destCat){ toast('请先创建一个分类'); return; }

    if(oldCat && oldCat.id === destCat.id && oldPos >= 0){
      destCat.foods.splice(oldPos, 0, newFood);
    }else{
      destCat.foods.push(newFood);
    }

    save();
    closeSheet();
    renderBookList();
    if(!document.getElementById('planView').hidden) renderPlan();
    toast(isNew ? '已添加' : '已保存');
  };

  const delBtn = $('fDel');
  if(delBtn){
    delBtn.onclick = () => {
      if(!delBtn.classList.contains('armed')){
        delBtn.classList.add('armed');
        delBtn.textContent = '再点一次确认删除';
        setTimeout(() => {
          if(delBtn.isConnected){ delBtn.classList.remove('armed'); delBtn.textContent = '删除这个食物'; }
        }, 3000);
        return;
      }
      const c = findCategoryOfFood(draft.id);
      if(c) c.foods = c.foods.filter(f => f.id !== draft.id);
      save(); closeSheet(); renderBookList(); toast('已删除');
    };
  }
}

/* =========================================================
   一日饮食规划
   ========================================================= */
function dateKeyOf(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
let planDate = dateKeyOf(new Date());

/* 折叠状态（默认展开） */
const collapsedMeals = new Set();

function getPlan(create){
  let p = state.plans[planDate];
  if(!p){
    if(!create) return emptyPlan();
    p = state.plans[planDate] = emptyPlan();
  }
  MEALS.forEach(m => { if(!Array.isArray(p[m.key])) p[m.key] = []; });
  return p;
}

function entryKcal(en){
  const food = findFoodById(en.foodId);
  if(food) return foodKcal(food, en.amount);
  return num(en.kcal);
}
function entryUnit(en){
  const food = findFoodById(en.foodId);
  return food ? food.unit : (en.unit || 'g');
}
function entryName(en){
  const food = findFoodById(en.foodId);
  return food ? food.name : (en.name || '');
}

const planListEl = document.getElementById('planList');

function renderPlan(){
  document.getElementById('planDate').value = planDate;

  const plan = getPlan(false);
  let dayTotal = 0;

  const mealsHTML = MEALS.map(m => {
    const entries = plan[m.key] || [];
    const collapsed = collapsedMeals.has(m.key);

    let mealTotal = 0;
    const rows = entries.map(en => {
      const kcal = entryKcal(en);
      mealTotal += kcal;
      const unit = entryUnit(en);
      const name = entryName(en);
      return `<div class="entry-row">
        <div class="entry-info">
          <div class="entry-name">${esc(name)}</div>
        </div>
        <div class="entry-amount">
          <input class="amount-input" type="number" inputmode="decimal"
                 data-meal="${m.key}" data-entry="${en.id}"
                 value="${esc(en.amount)}" aria-label="${esc(name)}食用量">
          <span class="amount-unit">${esc(unit)}</span>
        </div>
        <div class="entry-kcal" data-kcal="${en.id}">${fmt(kcal)}</div>
        <button class="entry-del" data-meal="${m.key}" data-entry="${en.id}" aria-label="删除">✕</button>
      </div>`;
    }).join('');

    dayTotal += mealTotal;

    return `<div class="card">
      <button class="meal-head" data-mealhead="${m.key}">
        <span class="meal-name">${m.icon} ${m.label}</span>
        <span class="meal-kcal" data-mealkcal="${m.key}">${fmt(mealTotal)} kcal</span>
        <span class="meal-chev ${collapsed ? '' : 'open'}">›</span>
      </button>
      ${collapsed ? '' : `
        ${entries.length ? `<div class="meal-items">${rows}</div>` : '<div class="empty-small">还没有记录</div>'}
        <div class="meal-foot">
          <button class="btn btn-primary btn-block" data-addmeal="${m.key}">＋ 添加食物</button>
        </div>`}
    </div>`;
  }).join('');

  planListEl.innerHTML = `
    <div class="total-card">
      <div class="total-label">今日摄入合计</div>
      <div class="total-value" id="dayTotal">${fmt(dayTotal)}<span> kcal</span></div>
    </div>
    ${mealsHTML}
  `;
}

/* 局部刷新合计（输入时避免整页重绘） */
function updatePlanTotals(){
  const plan = getPlan(false);
  let day = 0;

  MEALS.forEach(m => {
    const entries = plan[m.key] || [];
    let t = 0;
    entries.forEach(en => { t += entryKcal(en); });
    day += t;
    const el = document.querySelector(`[data-mealkcal="${m.key}"]`);
    if(el) el.textContent = fmt(t) + ' kcal';
  });

  const dEl = document.getElementById('dayTotal');
  if(dEl) dEl.innerHTML = fmt(day) + '<span> kcal</span>';
}

/* 点击：删除条目 / 添加食物 / 折叠餐次 */
planListEl.addEventListener('click', e => {
  const del = e.target.closest('.entry-del');
  if(del){
    const p = state.plans[planDate];
    if(!p) return;
    const key = del.dataset.meal;
    p[key] = (p[key] || []).filter(en => en.id !== del.dataset.entry);
    save(); renderPlan();
    return;
  }

  const addBtn = e.target.closest('[data-addmeal]');
  if(addBtn){ openAddEntrySheet(addBtn.dataset.addmeal); return; }

  const head = e.target.closest('[data-mealhead]');
  if(head){
    const key = head.dataset.mealhead;
    if(collapsedMeals.has(key)) collapsedMeals.delete(key);
    else collapsedMeals.add(key);
    renderPlan();
    return;
  }
});

/* 输入：直接修改食用量并同步热量 */
planListEl.addEventListener('input', e => {
  const inp = e.target.closest('.amount-input');
  if(!inp) return;

  const p = state.plans[planDate];
  if(!p) return;
  const arr = p[inp.dataset.meal];
  if(!Array.isArray(arr)) return;
  const en = arr.find(x => x.id === inp.dataset.entry);
  if(!en) return;

  const v = parseFloat(inp.value);
  en.amount = isNaN(v) ? 0 : v;

  const kcal = entryKcal(en);
  const kEl = document.querySelector(`[data-kcal="${en.id}"]`);
  if(kEl) kEl.textContent = fmt(kcal);

  updatePlanTotals();
  save();
});

/* 失焦：空值规范为 0 并回写显示 */
planListEl.addEventListener('blur', e => {
  const inp = e.target.closest ? e.target.closest('.amount-input') : null;
  if(!inp) return;
  if(inp.value.trim() === ''){
    inp.value = '0';
    const p = state.plans[planDate];
    if(!p) return;
    const arr = p[inp.dataset.meal] || [];
    const en = arr.find(x => x.id === inp.dataset.entry);
    if(en){ en.amount = 0; save(); }
    const kEl = document.querySelector(`[data-kcal="${inp.dataset.entry}"]`);
    if(kEl) kEl.textContent = '0';
    updatePlanTotals();
  }
}, true);

/* 日期切换 */
document.getElementById('prevDay').onclick = () => shiftDay(-1);
document.getElementById('nextDay').onclick = () => shiftDay(1);
document.getElementById('planDate').onchange = e => {
  if(e.target.value){ planDate = e.target.value; renderPlan(); }
};
function shiftDay(delta){
  const [y, m, d] = planDate.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + delta);
  planDate = dateKeyOf(dt);
  renderPlan();
}

/* 添加食物到某一餐 */
function openAddEntrySheet(mealKey){
  const meal = MEALS.find(m => m.key === mealKey);
  if(!meal) return;

  let q = '';
  let picked = null;
  let amountVal = '100';

  openSheet(`添加到${meal.label}`, `
    <div id="pickStep1">
      <div class="search-wrap inner-search">
        <span class="search-icon">🔍</span>
        <input id="pickSearch" type="search" placeholder="搜索食物名称" autocomplete="off" autocorrect="off">
      </div>
      <div id="pickList" class="pick-list"></div>
    </div>
    <div id="pickStep2" hidden></div>
  `);

  const step1 = document.getElementById('pickStep1');
  const step2 = document.getElementById('pickStep2');
  const pickSearch = document.getElementById('pickSearch');
  const pickList = document.getElementById('pickList');

  function renderList(){
    const rows = [];
    state.categories.forEach(cat => {
      cat.foods.forEach(food => {
        if(!q || food.name.toLowerCase().includes(q.toLowerCase())) rows.push({ cat, food });
      });
    });

    if(!rows.length){
      pickList.innerHTML = `<div class="empty-small">${state.categories.some(c => c.foods.length) ? '没有找到匹配的食物' : '图鉴里还没有食物，请先到「图鉴」添加'}</div>`;
      return;
    }

    pickList.innerHTML = rows.map(({ cat, food }) => `
      <button type="button" class="pick-row" data-food="${food.id}">
        <div class="pick-name">${esc(food.name)}</div>
        <div class="pick-sub">${esc(cat.name)} · ${basisText(food)}</div>
      </button>
    `).join('');
  }

  pickSearch.addEventListener('input', () => { q = pickSearch.value; renderList(); });

  pickList.addEventListener('click', e => {
    const row = e.target.closest('.pick-row');
    if(!row) return;
    const food = findFoodById(row.dataset.food);
    if(!food) return;
    picked = food;
    showStep2();
  });

  function showStep2(){
    step1.hidden = true;
    step2.hidden = false;

    step2.innerHTML = `
      <div class="picked-card">
        <div class="picked-name">${esc(picked.name)}</div>
        <div class="picked-sub">${basisText(picked)}</div>
      </div>
      <div class="field">
        <label>食用量（${unitName(picked.unit)}）</label>
        <input id="amountInput" class="input input-lg" type="number" inputmode="decimal" value="${amountVal}">
      </div>
      <div class="quick-amounts">
        ${[50,100,150,200,250].map(v => `<button type="button" class="chip" data-amt="${v}">${v}</button>`).join('')}
      </div>
      <div class="calc-box">
        <span>计算热量</span>
        <strong id="calcVal">0 kcal</strong>
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn btn-primary btn-block" id="confirmAdd">加入${meal.label}</button>
        <button type="button" class="btn btn-block" id="backPick">← 重新选择食物</button>
      </div>
    `;

    const amtInput = document.getElementById('amountInput');
    const calcVal = document.getElementById('calcVal');

    function updateCalc(){
      amountVal = amtInput.value;
      calcVal.textContent = fmt(foodKcal(picked, amountVal)) + ' kcal';
    }
    amtInput.addEventListener('input', updateCalc);
    updateCalc();

    step2.querySelectorAll('.chip').forEach(chip => {
      chip.onclick = () => { amtInput.value = chip.dataset.amt; updateCalc(); };
    });

    document.getElementById('backPick').onclick = () => {
      step2.hidden = true;
      step1.hidden = false;
      picked = null;
    };

    document.getElementById('confirmAdd').onclick = () => {
      const amt = num(amountVal);
      if(amt <= 0){ toast('请输入有效的食用量'); return; }
      addEntry(mealKey, picked, amt);
      closeSheet();
      renderPlan();
      toast(`已加入${meal.label}`);
    };
  }

  renderList();
}

function addEntry(mealKey, food, amount){
  const plan = getPlan(true);
  if(!Array.isArray(plan[mealKey])) plan[mealKey] = [];
  plan[mealKey].push({
    id: uid(),
    foodId: food.id,
    amount: amount,
    name: food.name,
    unit: food.unit,
    kcal: foodKcal(food, amount)
  });
  save();
}

/* =========================================================
   Tab 切换
   ========================================================= */
document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => switchTab(tab.dataset.tab);
});

function switchTab(name){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.getElementById('bookView').hidden = name !== 'book';
  document.getElementById('planView').hidden = name !== 'plan';
  document.getElementById('pageTitle').textContent = name === 'book' ? '食物图鉴' : '一日饮食规划';
  document.getElementById('topAction').hidden = name !== 'book';

  if(name === 'book') renderBookList();
  else renderPlan();

  document.getElementById('view').scrollTop = 0;
}

/* =========================================================
   主屏幕图标 & PWA
   ========================================================= */
(function setupIcon(){
  try{
    const size = 180;
    const c = document.createElement('canvas');
    c.width = size; c.height = size;
    const ctx = c.getContext('2d');

    const g = ctx.createLinearGradient(0, 0, size, size);
    g.addColorStop(0, '#4CE07A');
    g.addColorStop(1, '#1F9E44');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, size, size);

    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(150, 30, 70, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(20, 160, 55, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.font = '104px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🥗', size / 2, size / 2 + 4);

    const dataUrl = c.toDataURL('image/png');

    const l1 = document.createElement('link');
    l1.rel = 'apple-touch-icon';
    l1.setAttribute('sizes', '180x180');
    l1.href = dataUrl;
    document.head.appendChild(l1);

    const l2 = document.createElement('link');
    l2.rel = 'apple-touch-icon-precomposed';
    l2.href = dataUrl;
    document.head.appendChild(l2);

    const l3 = document.createElement('link');
    l3.rel = 'icon';
    l3.href = dataUrl;
    document.head.appendChild(l3);

    const manifest = {
      name: '热量图鉴',
      short_name: '热量图鉴',
      display: 'standalone',
      background_color: '#F2F2F7',
      theme_color: '#34C759',
      icons: [{ src: dataUrl, sizes: '180x180', type: 'image/png' }]
    };
    const mLink = document.createElement('link');
    mLink.rel = 'manifest';
    mLink.href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
    document.head.appendChild(mLink);
  }catch(e){ /* 忽略 */ }
})();

/* =========================================================
   启动
   ========================================================= */
renderBookList();
renderPlan();
</script>
</body>
